<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Checkout</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <script src="https://js.paystack.co/v1/inline.js"></script>
  </head>

  <body class="bg-gray-100 p-5">
    <!-- Heading -->
    <h1
      class="text-3xl font-bold mb-5 text-center bg-orange-500 text-white p-4 rounded-lg"
    >
      🛒 Your Cart
    </h1>

    <!-- Cart Items -->
    <div
      id="cartContainer"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 text-center"
    ></div>

    <!-- Checkout Form -->
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-lg mt-8">
      <h2 class="text-2xl font-bold mb-5 text-center text-orange-500">
        Checkout Details
      </h2>

      <input
        type="text"
        id="customerName"
        placeholder="Full Name"
        class="w-full border border-1 p-3 rounded-lg mb-4 border-orange-500"
      />

      <input
        type="email"
        id="customerEmail"
        placeholder="Email Address"
        class="w-full border border-1 p-3 rounded-lg mb-4 border-orange-500"
      />

      <input
        type="tel"
        id="customerPhone"
        placeholder="Phone Number"
        class="w-full border border-1 p-3 rounded-lg mb-4 border-orange-500"
      />
    </div>

    <!-- Grand Total -->
    <div class="flex justify-center mt-6">
      <h2
        class="text-2xl font-bold bg-white p-4 rounded-lg shadow-lg border-2 border-orange-500"
      >
        Grand Total: ₦<span id="grandTotal" class="text-orange-500">0</span>
      </h2>
    </div>

    <!-- Checkout Button -->
    <div class="flex justify-center mt-6">
      <button
        id="checkoutBtn"
        class="bg-green-600 hover:bg-green-500 text-white px-8 py-4 rounded-lg text-lg font-bold shadow-lg w-full max-w-md"
      >
        Proceed To Payment
      </button>
    </div>

    <!-- Back Button -->
    <div class="flex justify-center mt-5">
      <a
        href="product.html"
        class="bg-orange-500 hover:bg-orange-400 text-white px-8 py-4 rounded-lg text-lg font-bold w-full max-w-md text-center"
      >
        Back To Products
      </a>
    </div>

    <!-- Scroll To Top -->
    <a
      href="#"
      id="scroll-top"
      class="fixed bottom-10 right-10 bg-orange-500 w-12 h-12 rounded-full text-white flex items-center justify-center shadow-lg"
    >
      <i class="fa-solid fa-arrow-up"></i>
    </a>

    <!-- Remove Confirmation Modal -->
    <div
      id="confirmModal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 px-4"
    >
      <div
        class="bg-white w-full max-w-lg p-8 rounded-xl shadow-xl text-center"
      >
        <h2 class="text-3xl font-bold text-red-600 mb-5">Remove Product</h2>

        <p class="text-lg mb-8">
          Are you sure you want to remove this product?
        </p>

        <div class="flex justify-center gap-5">
          <button
            id="yesBtn"
            class="bg-red-600 text-white px-8 py-3 rounded-lg"
          >
            Yes
          </button>

          <button
            id="noBtn"
            class="bg-gray-500 text-white px-8 py-3 rounded-lg"
          >
            No
          </button>
        </div>
      </div>
    </div>

    <script src="../js_group/cart.js"></script>
  </body>
</html>

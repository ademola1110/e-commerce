<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cart</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>

  <body class="bg-white p-5">
    <!-- Heading -->
    <h1
      class="text-3xl font-bold mb-5 text-center bg-orange-400 text-white p-3 rounded-lg"
    >
      🛒 Your Cart
    </h1>

    <!-- Cart Container -->
    <div
      id="cartContainer"
      class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-5 rounded-lg"
    ></div>

    <!-- Grand Total -->
    <h2
      class="text-2xl font-bold mt-5 text-center bg-white p-3 rounded-lg w-[250px] ml-auto shadow-lg border-2 border-orange-500"
    >
      Grand Total: $<span id="grandTotal" class="text-orange-500">0</span>
    </h2>

    <!-- Back Button -->
    <div class="flex justify-center mt-[20px] pb-[40px]">
      <a
        class="text-center p-[20px] text-[20px] font-bold mt-[20px] bg-orange-500 text-white w-[300px] rounded-lg"
        href="product.html"
      >
        Back to Products Page
      </a>
    </div>

    <!-- Scroll To Top -->
    <a
      href="#"
      id="scroll-top"
      class="w-10 h-10 text-white fixed bottom-10 right-10 bg-orange-500 rounded-full"
    >
      <i class="fa-solid fa-arrow-up mx-[9px] my-3"></i>
    </a>

    <!-- Confirmation Modal -->
    <div
      id="confirmModal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div class="bg-white p-6 rounded-xl shadow-xl w-[350px] text-center">
        <h2 class="text-2xl font-bold mb-4 text-orange-500">Remove Product</h2>

        <p class="text-gray-700 mb-6">
          Are you sure you want to remove this product from cart?
        </p>

        <div class="flex justify-center gap-4">
          <button
            id="yesBtn"
            class="bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-lg"
          >
            Yes
          </button>

          <button
            id="noBtn"
            class="bg-gray-400 hover:bg-gray-500 text-white px-6 py-2 rounded-lg"
          >
            No
          </button>
        </div>
      </div>
    </div>

    <script src="cart.js"></script>
  </body>
</html>
